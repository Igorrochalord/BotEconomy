<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>BotEconomy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>📈 BotEconomy</h1>
    <button id="refresh" title="Atualizar">⟳</button>
  </header>

  <section id="status" class="hint"></section>

  <nav class="tabs">
    <button class="tab active" data-tab="movers">Mercado</button>
    <button class="tab" data-tab="tickers">Ações</button>
    <button class="tab" data-tab="alerts">Alertas</button>
  </nav>

  <section id="tab-movers" class="tab-panel active">
    <h2>Maiores Altas</h2>
    <ul id="top-positive" class="ticker-list"></ul>
    <h2>Maiores Quedas</h2>
    <ul id="top-negative" class="ticker-list"></ul>
    <button id="report">Gerar relatório em PDF</button>
  </section>

  <section id="tab-tickers" class="tab-panel">
    <form id="add-ticker-form">
      <input id="new-ticker" placeholder="Ex: NVDA" maxlength="10" required />
      <button type="submit">Adicionar</button>
    </form>
    <ul id="tickers-list" class="ticker-list"></ul>
  </section>

  <section id="tab-alerts" class="tab-panel">
    <form id="add-alert-form">
      <input id="alert-ticker" placeholder="Ticker" maxlength="10" required />
      <select id="alert-condition">
        <option value="above">acima de</option>
        <option value="below">abaixo de</option>
      </select>
      <input id="alert-price" type="number" step="0.01" placeholder="Preço" required />
      <button type="submit">Criar alerta</button>
    </form>
    <ul id="alerts-list" class="ticker-list"></ul>
  </section>

  <footer>
    <a href="#" id="open-options">Configurações</a>
  </footer>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
