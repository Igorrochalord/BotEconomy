<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>BotEconomy — Configurações</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; color: #0f172a; }
    h1 { font-size: 18px; }
    label { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
    input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #cbd5e1; border-radius: 4px; }
    button { margin-top: 18px; padding: 8px 14px; background: #0f766e; color: white; border: none; border-radius: 4px; cursor: pointer; }
    p.hint { font-size: 12px; color: #64748b; }
    #saved { font-size: 12px; color: #15803d; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>📈 BotEconomy — Configurações</h1>
  <p class="hint">Aponte para a instância do backend do BotEconomy (o mesmo backend usado pelo bot do Telegram).</p>

  <label for="apiBaseUrl">URL do backend</label>
  <input id="apiBaseUrl" placeholder="http://localhost:8000" />

  <label for="apiKey">Chave de API (opcional, BOTECONOMY_API_KEY)</label>
  <input id="apiKey" type="password" placeholder="deixe em branco se não configurada" />

  <label for="refreshMinutes">Atualizar em segundo plano a cada (minutos)</label>
  <input id="refreshMinutes" type="number" min="5" step="1" />

  <div>
    <button id="save">Salvar</button>
    <span id="saved"></span>
  </div>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
