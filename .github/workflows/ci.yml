name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  telegram-bot:
    name: Telegram bot (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: telegram-bot/requirements-dev.txt

      - name: Install dependencies
        working-directory: telegram-bot
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: telegram-bot
        run: ruff check bot.py stocks.py storage.py tests

      - name: Test (pytest)
        working-directory: telegram-bot
        run: pytest -v

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build telegram-bot image
        run: docker build -t boteconomy-telegram-bot:ci ./telegram-bot
